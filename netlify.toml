# Beach Day: netlify.toml. All paths are relative to the repo root.
# Settings here override the same settings in the Netlify UI.

[build]
  # 1. build-agents: .claude/agents/*.md + skills + knowledge -> netlify/functions/lib/agents.json
  # 2. stamp-sw:     __BUILD_VERSION__ in public/sw.js -> short COMMIT_REF, and
  #                  writes public/version.json (docs/03 §9).
  # 3. gen-config:   writes the git-ignored public/generated/config.js from
  #                  SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY and COMMIT_REF, and
  #                  FAILS the build unless the key starts with sb_publishable_
  #                  and the CSP host in public/_headers equals SUPABASE_URL
  #                  (ADR-0006). A failed build costs 0 credits and leaves the
  #                  previous deploy live.
  # No script may print environment variables: the Free plan has no env-var
  # scopes, so builds can read every variable, secrets included.
  # vitest is deliberately NOT here (docs/03 §9.4): tests/** is writable by
  # agents, and anything run at build time sees every secret on Free.
  command = "node scripts/build-agents.mjs && node scripts/stamp-sw.mjs && node scripts/gen-config.mjs"
  publish = "public"

  # Skip the build (and the 15-credit production deploy) when nothing that
  # ships has changed. Exit 0 = skip, exit 1 = build.
  #  * `[ -n "$CACHED_COMMIT_REF" ]` makes a missing cached ref BUILD. Without
  #    it, an empty variable shifts the arguments and git compares the working
  #    tree with COMMIT_REF, which is clean, so the very first build is skipped.
  #  * `|| exit 1` turns every failure (git exit 128 when the cached commit is
  #    not in the clone, for example) into exit 1, the documented "build" code.
  #  * The path list is the whitelist of what the build reads or publishes. It
  #    must equal DEPLOY_PATHS in netlify/functions/lib/deploys.mts (a unit test
  #    checks). D9: knowledge/ and .claude/skills are bundled into each agent's
  #    system prompt, so they are on the list. docs/, tests/ and root *.md skip.
  # A TOML literal string, so the inner double quotes need no escapes.
  ignore = '[ -n "$CACHED_COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- public netlify netlify.toml package.json package-lock.json scripts .claude/agents .claude/skills knowledge || exit 1'

  [build.environment]
    # Pin the build's Node so the functions runtime does not change silently.
    # Build variables only. Functions cannot see this table, and it never holds secrets.
    NODE_VERSION = "22"

[functions]
  # Outside the publish directory: function source must never be published.
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # agents.json is generated by the build and read at runtime, so include it.
  included_files = ["netlify/functions/lib/agents.json"]

# Security headers live in public/_headers (one source of truth, no [[headers]]).
# Rate limits for functions live in each function's `config.rateLimit`;
# they cannot be declared in netlify.toml.
# Secrets and per-context values are set in the UI/CLI, never here.
