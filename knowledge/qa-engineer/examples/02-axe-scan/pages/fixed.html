<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Beach Day verdict card (fixed)</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 16px; background: #fff; }
    .verdict { color: #14532d; }                  /* dark green, well above 4.5:1 */
    .icons { display: flex; gap: 8px; }
    .icons button { min-width: 44px; min-height: 44px; } /* Beach Day target: 44 px */
  </style>
</head>
<body>
  <main>
    <h1>Miami Beach</h1>
    <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="Sunny">
    <p class="verdict">Great beach day</p>
    <div class="icons">
      <button aria-label="Save beach"><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="5"/></svg></button>
      <button aria-label="Share forecast"><svg width="12" height="12" aria-hidden="true"><rect width="12" height="12"/></svg></button>
    </div>
  </main>
</body>
</html>
