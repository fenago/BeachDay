<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display:none">
  <!-- Beach Day weather icons. Original artwork drawn for Beach Day (not SF Symbols).
       24x24 grid, 2px round strokes, currentColor so they inherit the chip's on-color. -->
  <symbol id="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <title>Sunny</title>
    <circle cx="12" cy="12" r="4.25"/>
    <path d="M12 2.5v2.25M12 19.25v2.25M2.5 12h2.25M19.25 12h2.25M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>
  </symbol>
  <symbol id="sun-cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <title>Mostly sunny</title>
    <path d="M5.6 11.2a3.3 3.3 0 1 1 5.9-2.6"/>
    <path d="M8.5 2.5v1.5M2.5 8.5H4M4.3 4.3l1.05 1.05M12.7 4.3l-1.05 1.05"/>
    <path d="M9 20.5h8.25a3.75 3.75 0 0 0 .45-7.47 5 5 0 0 0-9.45 1.32A3.1 3.1 0 0 0 9 20.5z"/>
  </symbol>
  <symbol id="cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <title>Cloudy</title>
    <path d="M7.25 19h10a4.25 4.25 0 0 0 .5-8.47 5.75 5.75 0 0 0-11 1.5A3.5 3.5 0 0 0 7.25 19z"/>
  </symbol>
  <symbol id="storm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <title>Storms</title>
    <path d="M7.5 15.5H6.9A3.4 3.4 0 0 1 6.6 8.7a5.6 5.6 0 0 1 10.7-1.45 4.15 4.15 0 0 1-.55 8.25"/>
    <path d="M12.75 12.5l-2.5 4.25h3.5l-2.5 4.75"/>
  </symbol>
</svg>
